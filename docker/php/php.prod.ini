; ── Production PHP settings ───────────────────────────────────────────────── ;
[PHP]
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On

memory_limit = 256M
max_execution_time = 30
max_input_time = 30
post_max_size = 32M
upload_max_filesize = 32M

; OPcache — aggressive caching for production
[opcache]
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0   ; Never revalidate in prod (faster)
opcache.save_comments = 1         ; Required by Symfony annotations
opcache.preload = /app/var/cache/prod/opcache-preload.php
opcache.preload_user = www-data

; APCu
[apcu]
apc.enable_cli = 1
